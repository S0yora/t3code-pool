name: Build Android APK (t3code-pool)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: App variant (preview installs side-by-side with official T3 Code)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      abi:
        description: Android CPU architecture(s)
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a
  push:
    branches:
      - pool-main
    paths:
      - apps/mobile/**
      - packages/shared/src/accountPool/**
      - packages/contracts/src/providerPool.ts
      - .github/workflows/t3code-pool-android-apk.yml

concurrency:
  group: t3code-pool-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Android APK (${{ inputs.variant || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: ${{ inputs.variant || 'preview' }}
      ANDROID_ABI: ${{ inputs.abi || 'arm64-v8a' }}
      NODE_OPTIONS: --max-old-space-size=6144
      EXPO_NO_GIT_STATUS: "1"
      EXPO_NO_TYPESCRIPT_SETUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform android

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures="${ANDROID_ABI}" \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            --no-daemon

      - name: Package APK
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          OUT="t3code-pool-${APP_VARIANT}-${SHORT_SHA}.apk"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"
        id: pkg

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.apk_name }}
          path: ${{ steps.pkg.outputs.apk_name }}
          retention-days: 30
